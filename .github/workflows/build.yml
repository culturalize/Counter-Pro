name: Build SplitCounter

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile SplitCounter.exe
        shell: cmd
        run: call build.bat

      - name: Run smoke test (-TestExit)
        shell: cmd
        run: SplitCounter.exe -TestExit

      - name: Upload SplitCounter.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitCounter-Windows-x64
          path: SplitCounter.exe
