name: Build & Release Counter-Pro

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Counter-Pro.exe
        shell: cmd
        run: call build.bat

      - name: Run smoke test (-TestExit)
        shell: cmd
        run: Counter-Pro.exe -TestExit

      - name: Package Release Assets (EXE + ZIP + SHA256SUMS)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist\Counter-Pro\src" -Force | Out-Null
          Copy-Item "Counter-Pro.exe" "dist\Counter-Pro\Counter-Pro.exe" -Force
          Copy-Item "build.bat" "dist\Counter-Pro\build.bat" -Force
          Copy-Item "README.md" "dist\Counter-Pro\README.md" -Force
          Copy-Item "LICENSE" "dist\Counter-Pro\LICENSE" -Force
          Copy-Item "CHANGELOG.md" "dist\Counter-Pro\CHANGELOG.md" -Force
          Copy-Item "SECURITY.md" "dist\Counter-Pro\SECURITY.md" -Force
          Copy-Item "src\Program.cs" "dist\Counter-Pro\src\Program.cs" -Force
          Copy-Item "src\app.ico" "dist\Counter-Pro\src\app.ico" -Force

          Compress-Archive -Path "dist\Counter-Pro\*" -DestinationPath "Counter-Pro-Windows-x64.zip" -Force

          $exeHash = (Get-FileHash "Counter-Pro.exe" -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "Counter-Pro-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  Counter-Pro.exe"
            "$zipHash  Counter-Pro-Windows-x64.zip"
          ) | Set-Content -Path "SHA256SUMS.txt" -Encoding UTF8

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Counter-Pro-Windows-x64
          path: |
            Counter-Pro.exe
            Counter-Pro-Windows-x64.zip
            SHA256SUMS.txt

      - name: Publish GitHub Release (v2.0.1)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v2.0.1"
          $notes = @'
          ## Counter-Pro v2.0.1

          Ultra-lightweight global hotkey counter & customizable game HUD overlay for Windows 10/11 (~115 KB standalone executable, ~3.4 MB idle RAM, zero external dependencies).

          ### 📥 Installation (Pick Either Option)
          - **Option 1 — Direct Standalone App:** Download **`Counter-Pro.exe`** below and run it directly. It automatically creates `counter.txt` (starting at `0`) and `settings.json` on first launch.
          - **Option 2 — Full Release Bundle (`.zip`):** Download **`Counter-Pro-Windows-x64.zip`** containing `Counter-Pro.exe`, `build.bat` (1-click source compiler), `README.md`, `CHANGELOG.md`, `SECURITY.md`, `LICENSE`, and `src\`.

          ### 🛠 What's Fixed in v2.0.1 (Game Launch & EasyAntiCheat Compatibility)
          - **Removed Automatic Game Launch Watcher (`-Watch`):** Permanently removed background process polling (`CreateToolhelp32Snapshot`), auto-start registry keys, and automatic desktop resolution switching during game launch.
          - **Root Cause Postmortem:** Calling `ChangeDisplaySettingsW` and asserting `HWND_TOPMOST` with `SWP_SHOWWINDOW` via an `EVENT_SYSTEM_FOREGROUND` hook within 0–2s of `FortniteLauncher.exe` starting interrupted Unreal Engine's initial DXGI Exclusive Fullscreen swapchain acquisition (`IDXGISwapChain::SetFullscreenState`), causing EasyAntiCheat's 60-second window-visibility watchdog (`Time spent waiting for the game window to become visible: 60013 ms`) to time out with `exit status 1`.
          - **Passive Z-Order Keeper:** Replaced `SetWinEventHook(EVENT_SYSTEM_FOREGROUND)` with a passive 1500ms `SWP_NOACTIVATE | SWP_NOSENDCHANGING` check that never interferes with fullscreen transitions, and removed all `unsafe` / process-snapshot code.

          ### ✨ Core Features
          - **4 View Modes (`F6`):** Full Card, Mini Card, Slim Gaming HUD Pill, and Just Number Transparent Floating Overlay.
          - **5-Tab Customization Studio (`⚙ Setup`):**
            - Visual Keyboard (`100%`, `80% TKL`, `75%`, `65%`, `60%`) & 5-Button Gaming Mouse hotkey selector.
            - Free-draggable custom images & 8 built-in game stickers (Chest, Crown, Gem, Skull, Flame, Key, Trophy, Star).
            - 19 colour themes + Custom RGB Theme Builder.
            - 8 fonts, custom prefix/suffix labels, adjustable outline width, and 2-color directional custom gradients.
          - **100% Mouse Pass-Through Mode (`F8`):** Mouse aiming, hover, and clicks pass straight through the overlay into your game.
          - **Hold-Click + Scroll Wheel Scaling:** Live resize the counter number or any sticker on the fly.
          - **30-Day Rolling Daily Backups:** Automatic daily backups of `counter.txt` in `backups/`.
          '@
          $notes | Set-Content -Path "RELEASE_NOTES.md" -Encoding UTF8

          $ErrorActionPreference = 'Continue'
          gh release delete $tag --yes --cleanup-tag 2>$null
          $ErrorActionPreference = 'Stop'
          gh release create $tag "Counter-Pro.exe" "Counter-Pro-Windows-x64.zip" "SHA256SUMS.txt" --title "Counter-Pro $tag" --notes-file "RELEASE_NOTES.md" --latest
          exit 0
